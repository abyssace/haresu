[project]
name = "haresu"
version = "0.1.0"
description = "A visual meta-harness: build agent harnesses on a canvas and improve them version by version with evals and a promotion gate."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["agents", "llm", "harness", "evals", "mcp", "visual"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.0",
    "mcp>=2.0",
]

[project.urls]
Repository = "https://github.com/abyssace/haresu"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
haresu = "haresu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haresu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
